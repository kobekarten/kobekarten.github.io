
project:
  type: website
  output-dir: docs
  render:
  - "index.qmd"
  - "content/**"
  resources:
    - js/argmap-backdrop.js          # ensure it's copied into _site/js/
lang: de


website:
  title: "Argumentlandkarten"
  description: "Kontroversen begleiten mit Argumentlandkarten"
  favicon: ""

  navbar:
    background: primary
    search: true
    left:
      - text: "Das Projekt"
        href: index.qmd
      - text: "Das Team"
        href: content/team.qmd
      - text: "Mariam-1"
        href: content/index-mariam_1.qmd
      - text: "Themen & Bausteine"
        menu:
          - text: "Baukasten Argumentkartierung"
            href: content/baukasten_argumentkartierung.qmd
          - text: "Grundlagenseminare"
            href: content/grundlagenseminare.qmd

  page-footer:
    left: 
      - "Argumentlandkarten"
    center: |
      Gefördert von <a href="https://stiftung-hochschullehre.de" target="_blank" rel="noopener" class="footer-logo-link"><img src="content/images/Logo_Stiftung_Hochschullehre.svg" alt="Stiftung Hochschullehre" class="footer-logo-svg"></a> <a href="https://hhu.de" target="_blank" rel="noopener" class="footer-logo-png-link"><img src="content/images/hhu_logo_transparent.png" alt="HHU" class="footer-logo-png"></a>
    right:
      - text: "Datenschutz"
        href: https://www.hhu.de/datenschutzerklaerung
      - text: "Impressum"
        href: https://www.hhu.de/impressum
      - text: 'Gebaut mit <a href="https://quarto.org">Quarto</a>'

format:
  html:
    css: menu_anim.css
    respect-user-color-scheme: true
    template-partials:
      - assets/partials/title-block.html
    theme:
      light: flatly
      dark: darkly
    toc-depth: 3
    argdown:
      mode: web-component
      sourceHighlighter: web-component
      config: argdown.config.json
    include-in-header:
      text: |
        <style>
          /* body becomes a stacking context, so a -1 layer sits behind the
             content but ABOVE the theme background — no background overrides */
          body { position: relative; z-index: 0; }
          #amb-page {
            position: fixed; inset: 0;
            z-index: -1; pointer-events: none;
            color: #2b3a4a;                 /* nodes read this via currentColor */
          }
          body.quarto-dark #amb-page { color: #9fb3c8; }
        </style>
    include-after-body:
      text: |
        <div id="amb-page" aria-hidden="true"></div>
        <script src="/js/argmap-backdrop.js"></script>
        <script>
          (function () {
            var host = document.getElementById('amb-page');
            if (!host) return;
            var inst = null, wasDark = null;
            function draw() {
              var dark = document.body.classList.contains('quarto-dark');
              if (dark === wasDark) return;
              wasDark = dark;
              if (inst) inst.destroy();
              inst = ArgmapBackdrop.mount(host, {
                opacity: dark ? .20 : .15,
                preserveAspectRatio: 'xMidYMid meet',
                width: 1600, height: 900,
                nodeW: [86, 130], nodeH: [30, 40],   // bigger boxes
                rowGap: 130,                          // shorter arrows
                maxNodes: 16, maxDepth: 4,
                growEvery: 1300, loop: true,
                colors: dark ? { support: '#4fd18b', attack: '#ff7a6b' }
                             : { support: '#2f8f5b', attack: '#cf4b3e' }
              });
            }
            draw();
            new MutationObserver(draw).observe(document.body,
              { attributes: true, attributeFilter: ['class'] });
          })();
        </script>
  pdf:
    documentclass: article
    pdf-engine-opt: "-shell-escape"
    papersize: a4
    toc: false
    include-in-header: assets/latex/_handout-packages.tex
    template-partials:
      - assets/latex/before-body.tex
    syntax-definitions:
      - assets/pandoc/argdown.xml
    syntax-highlighting: assets/pandoc/argdown.theme

execute:
  freeze: auto

filters:
  - ./node_modules/.bin/argdown-filter
  
argdown:
  mode: inline
  format: svg
  config: argdown.config.json
